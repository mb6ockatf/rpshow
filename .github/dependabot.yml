# dependabot.yml - keep the actions used by the workflows up to date.
#
# Copyright (C) 2026 mb6ockatf
# This file is free software; see COPYING for copying conditions.
#
# All updates arrive grouped in one weekly pull request.  Container
# images named in the workflows are not covered.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI
